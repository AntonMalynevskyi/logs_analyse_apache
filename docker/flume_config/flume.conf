# Name components
agent1.sources = kafkaSource
agent1.channels = memChannel
agent1.sinks = hdfsSink

# Source: Consume generated log records from Kafka
agent1.sources.kafkaSource.type = org.apache.flume.source.kafka.KafkaSource
agent1.sources.kafkaSource.kafka.bootstrap.servers = broker:29092
agent1.sources.kafkaSource.kafka.topics = logs
agent1.sources.kafkaSource.kafka.consumer.group.id = flume
agent1.sources.kafkaSource.kafka.consumer.auto.offset.reset = earliest
agent1.sources.kafkaSource.batchSize = 1000

# Channel: Buffer logs in memory before flushing
agent1.channels.memChannel.type = memory
# Bound the local demo buffer to keep memory use predictable.
agent1.channels.memChannel.capacity = 100000
agent1.channels.memChannel.transactionCapacity = 10000

# Sink: Write to HDFS NameNode
agent1.sinks.hdfsSink.type = hdfs
agent1.sinks.hdfsSink.hdfs.path = hdfs://namenode:9000/logs/%Y-%m-%d/
agent1.sinks.hdfsSink.hdfs.filePrefix = app-log
agent1.sinks.hdfsSink.hdfs.fileType = DataStream
agent1.sinks.hdfsSink.hdfs.writeFormat = Text
agent1.sinks.hdfsSink.hdfs.rollCount = 0
agent1.sinks.hdfsSink.hdfs.rollInterval = 60
agent1.sinks.hdfsSink.hdfs.rollSize = 134217728
agent1.sinks.hdfsSink.hdfs.useLocalTimeStamp = true
agent1.sinks.hdfsSink.hdfs.batchSize = 10000
agent1.sinks.hdfsSink.hdfs.minBlockReplicas = 1
agent1.sinks.hdfsSink.hdfs.callTimeout = 60000
agent1.sinks.hdfsSink.hdfs.threadsPoolSize = 10

# Bind source and sink to channel
agent1.sources.kafkaSource.channels = memChannel
agent1.sinks.hdfsSink.channel = memChannel
