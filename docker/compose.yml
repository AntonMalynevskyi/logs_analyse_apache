services:
  namenode:
    image: apache/hadoop:3.5.0
    container_name: namenode
    hostname: namenode
    user: root
    environment:
      ENSURE_NAMENODE_DIR: "/tmp/hadoop-root/dfs/name"
    command: >
      bash -c "if [ ! -d /tmp/hadoop-root/dfs/name/current ]; then
                 hdfs namenode -format -force;
               fi && hdfs namenode"
    ports:
      - "9870:9870"  
      - "9000:9000"  
    volumes:
      - namenode_data:/tmp/hadoop-root/dfs/name
      - ./hadoop_config:/opt/hadoop/etc/hadoop
    healthcheck:
      test: ["CMD", "hdfs", "dfs", "-ls", "/"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - hadoop-net

  datanode:
    image: apache/hadoop:3.5.0
    container_name: datanode
    hostname: datanode
    user: root
    command: ["hdfs", "datanode"]
    ports:
      - "9864:9864"  
    volumes:
      - datanode_data:/tmp/hadoop-root/dfs/data
      - ./hadoop_config:/opt/hadoop/etc/hadoop
    depends_on:
      namenode:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-ec", "echo > /dev/tcp/127.0.0.1/9866"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - hadoop-net

  resourcemanager:
    profiles:
      - yarn
    image: apache/hadoop:3.5.0
    container_name: resourcemanager
    hostname: resourcemanager
    user: root
    command: ["yarn", "resourcemanager"]
    ports:
      - "8088:8088"  
    volumes:
      - ./hadoop_config:/opt/hadoop/etc/hadoop
    depends_on:
      namenode:
        condition: service_healthy
      datanode:
        condition: service_healthy
    networks:
      - hadoop-net

  nodemanager:
    profiles:
      - yarn
    image: apache/hadoop:3.5.0
    container_name: nodemanager
    hostname: nodemanager
    user: root
    command: ["yarn", "nodemanager"]
    ports:
      - "8042:8042"  
    volumes:
      - ./hadoop_config:/opt/hadoop/etc/hadoop
    depends_on:
      resourcemanager:
        condition: service_started
    networks:
      - hadoop-net

  flume:
    build:
      context: .
      dockerfile: Dockerfile.flume
    container_name: flume
    user: root
    environment:
      - JAVA_OPTS=-Xms512m -Xmx2g -XX:+UseG1GC
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1G
    volumes:
      - ./flume_config:/flume_config
      - ./flume_config/flume-env.sh:/opt/flume/conf/flume-env.sh
      - ./hadoop_config/:/opt/hadoop/etc/hadoop
    command: >
      flume-ng agent 
      --conf /opt/flume/conf 
      --conf-file /flume_config/flume.conf 
      --name agent1 
      -Dflume.root.logger=INFO,console
      --classpath "/opt/hadoop/share/hadoop/common/*:/opt/hadoop/share/hadoop/common/lib/*:/opt/hadoop/share/hadoop/hdfs/*:/opt/hadoop/share/hadoop/hdfs/lib/*"
    depends_on:
      broker:
        condition: service_healthy
      namenode:
        condition: service_healthy
      datanode:
        condition: service_healthy
    networks:
      - hadoop-net

  broker:
    image: apache/kafka:4.2.2
    container_name: broker
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"
      - "29092:29092"
    healthcheck:
      test: ["CMD", "bash", "-ec", "echo > /dev/tcp/127.0.0.1/9092"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - hadoop-net

  spark-streaming:
    image: apache/spark:4.2.0-python3
    container_name: spark-streaming
    entrypoint: ["/bin/sh", "/opt/spark-apps/submit.sh"]
    command: ["streaming_metrics.py"]
    environment:
      SPARK_MODE: streaming
      HADOOP_CONF_DIR: /opt/spark/conf/hadoop
      PYTHONPATH: /opt/spark-apps
    volumes:
      - ../spark:/opt/spark-apps
      - ./hadoop_config:/opt/spark/conf/hadoop:ro
    depends_on:
      broker:
        condition: service_healthy
      namenode:
        condition: service_healthy
      datanode:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hadoop-net

  spark-batch:
    image: apache/spark:4.2.0-python3
    profiles:
      - batch
    entrypoint: ["/bin/sh", "/opt/spark-apps/submit.sh"]
    command: ["batch_metrics.py"]
    environment:
      SPARK_MODE: batch
      HADOOP_CONF_DIR: /opt/spark/conf/hadoop
      PYTHONPATH: /opt/spark-apps
    volumes:
      - ../spark:/opt/spark-apps
      - ./hadoop_config:/opt/spark/conf/hadoop:ro
    depends_on:
      namenode:
        condition: service_healthy
      datanode:
        condition: service_healthy
    restart: "no"
    networks:
      - hadoop-net


volumes:
  namenode_data:
  datanode_data:

networks:
  hadoop-net:
    driver: bridge
